<style>
:root{
  --azul:#14457C;

  --papel:#FFFFFF;
  --tinta:#0F2338;

  --amarelo:#E3A21A;

}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--vidro);
  color:var(--tinta);
  font-family:'Karla',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;

}
.wrap{max-width:940px;margin:0 auto;padding:0 18px 80px}

header{
  background:var(--azul);color:#fff;

  background-size:60px 60px;
}
.hero{max-width:940px;margin:0 auto;padding:44px 18px 38px}
.hero h1{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:clamp(2.8rem,9vw,4.6rem);line-height:.95;margin:0 0 10px;letter-spacing:-.02em}
.hero .fechas{font-size:1.05rem;font-weight:500;color:#DCE8F3;margin:0 0 22px}
.hero .quienes{display:flex;flex-wrap:wrap;gap:8px}
.quienes span{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);padding:4px 12px;border-radius:100px;font-size:.85rem;font-weight:500}
.vuelos-hero{margin-top:22px;padding-top:18px;border-top:1px solid rgba(255,255,255,.25);display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;font-size:.88rem;color:#D6E4F1}
.vuelos-hero b{display:block;color:#fff;font-size:1rem;font-weight:600}

nav{position:sticky;top:0;z-index:20;background:var(--azul-hondo);overflow-x:auto;-webkit-overflow-scrolling:touch;box-shadow:0 2px 10px rgba(15,35,56,.2)}
.navin{display:flex;max-width:940px;margin:0 auto;padding:0 8px;min-width:max-content}
nav button{background:none;border:0;cursor:pointer;color:#A9C3DD;font-family:'Karla',sans-serif;font-size:.92rem;font-weight:600;padding:14px 15px 12px;border-bottom:3px solid transparent;white-space:nowrap}
nav button .dia{display:block;font-size:.72rem;font-weight:500;opacity:.8}
nav button:hover{color:#fff}
nav button.on{color:#fff;border-bottom-color:var(--amarelo)}
nav.nav1{background:var(--tinta);box-shadow:none;top:auto;position:relative;z-index:21}
nav.nav1 button{font-family:'Fraunces',serif;font-size:1.15rem;font-weight:600;padding:12px 20px 10px;color:#7E93A8;border-bottom-width:4px}
nav.nav1 button.on{color:#fff;border-bottom-color:#fff}
nav.nav1 button.pendiente{color:#55697C;font-style:italic}
nav button:focus-visible{outline:2px solid var(--amarelo);outline-offset:-4px}

.panel{display:none;padding-top:34px}
.panel.on{display:block}
.titulo{font-family:'Fraunces',Georgia,serif;font-size:2rem;font-weight:600;line-height:1.1;margin:0 0 6px;color:var(--azul-hondo)}
.bajada{color:var(--tinta-suave);margin:0 0 8px;max-width:62ch}
.marca{display:inline-block;margin-bottom:26px;font-size:.8rem;font-weight:700;color:var(--azul);background:#fff;border:1px solid var(--pedra);padding:3px 10px;border-radius:4px}
.marca.duro{color:#9A4B12;border-color:#E8C9A8;background:#FDF3E7}

.tl{position:relative;margin:0;padding:0 0 0 76px;list-style:none}
.tl:before{content:'';position:absolute;left:60px;top:10px;bottom:26px;width:2px;background:var(--pedra)}
.tl li{position:relative;margin-bottom:16px}
.hora{position:absolute;left:-76px;top:14px;width:48px;text-align:right;font-size:.82rem;font-weight:700;color:var(--azul);font-variant-numeric:tabular-nums}
.tl li:before{content:'';position:absolute;left:-20px;top:19px;width:11px;height:11px;border-radius:50%;background:#fff;border:2px solid var(--azul-suave);z-index:2}
.tl li.comida:before{background:var(--amarelo);border-color:var(--amarelo)}
.card{background:var(--papel);border:1px solid var(--pedra);border-radius:8px;overflow:hidden}
.cuerpo{padding:14px 16px}
.card h3{margin:0 0 4px;font-size:1.05rem;font-weight:700;line-height:1.3}
.card p{margin:0;color:var(--tinta-suave);font-size:.93rem}
li.comida .card{border-left:5px solid var(--amarelo)}
.tipo{font-size:.72rem;font-weight:700;color:#8A6410;margin-bottom:2px}
.sitio{font-size:.85rem;color:var(--tinta-suave);margin-top:6px}
.alerta{margin-top:8px;background:#FDF3E7;border-left:3px solid var(--amarelo);padding:8px 11px;font-size:.87rem;color:#6E4A08;border-radius:0 4px 4px 0}
.suplente{margin-top:8px;font-size:.85rem;color:var(--tinta-suave);border-top:1px dashed var(--pedra);padding-top:7px}

.foto{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--vidro);border-bottom:1px solid var(--pedra)}
.sinfoto{display:none;width:100%;aspect-ratio:16/9;background:linear-gradient(135deg,var(--azul) 0%,var(--azul-suave) 100%);color:#fff;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-size:1.3rem;text-align:center;padding:0 20px}
.pie{padding:7px 16px 0;font-size:.8rem;color:var(--tinta-suave);font-style:italic}
.historia{margin-top:10px;padding-top:10px;border-top:1px solid var(--vidro);font-size:.91rem;color:var(--tinta-suave)}
.historia b{color:var(--azul);font-weight:700}

.barra{background:var(--papel);border:1px solid var(--pedra);border-radius:8px;padding:14px 16px;margin-bottom:24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.barra .conteo{font-family:'Fraunces',serif;font-size:1.6rem;font-weight:600;color:var(--azul)}
.progreso{flex:1;min-width:160px;height:8px;background:var(--vidro);border-radius:100px;overflow:hidden}
.progreso i{display:block;height:100%;background:var(--verde);width:0;transition:width .25s ease}
.grupo{margin-bottom:28px}
.grupo > h3{font-family:'Fraunces',serif;font-size:1.25rem;font-weight:600;color:var(--azul-hondo);margin:0 0 4px}
.grupo > .nota{color:var(--tinta-suave);font-size:.9rem;margin:0 0 12px}
.item{display:flex;gap:12px;align-items:flex-start;background:var(--papel);border:1px solid var(--pedra);border-radius:8px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.item input{margin-top:4px;width:19px;height:19px;accent-color:var(--verde);cursor:pointer;flex:none}
.item .que{font-weight:700}
.item .como{font-size:.88rem;color:var(--tinta-suave)}
.item.listo{background:#F2F8F5;border-color:#B9DCC9}
.item.listo .que{text-decoration:line-through;color:var(--tinta-suave)}

.bloque{background:var(--papel);border:1px solid var(--pedra);border-radius:8px;padding:18px 20px;margin-bottom:18px}
.bloque h3{font-family:'Fraunces',serif;font-size:1.2rem;margin:0 0 12px;color:var(--azul-hondo)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--vidro);vertical-align:top}
th{color:var(--tinta-suave);font-weight:600;width:38%}
.falta{color:#9A4B12;font-style:italic}
.costos input{width:110px;padding:6px 8px;border:1px solid var(--pedra);border-radius:5px;font-family:'Karla',sans-serif;font-size:.92rem;text-align:right;color:var(--tinta)}
.costos td:last-child{text-align:right}
.total{font-family:'Fraunces',serif;font-size:1.5rem;font-weight:600;color:var(--azul)}
ul.limpia{margin:0;padding-left:20px;color:var(--tinta-suave);font-size:.93rem}
ul.limpia li{margin-bottom:6px}
ul.limpia b{color:var(--tinta)}
footer{max-width:940px;margin:40px auto 0;padding:20px 18px;border-top:1px solid var(--pedra);color:var(--tinta-suave);font-size:.85rem}
footer a{color:var(--azul)}
@media (max-width:620px){
  .tl{padding-left:52px}
  .tl:before{left:40px}
  .hora{left:-52px;width:34px;font-size:.75rem}
  .tl li:before{left:-16px}
}
@media print{
  nav,.barra{display:none}
  .panel{display:block!important;page-break-after:always;padding-top:20px}
  body{background:#fff}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  let li='';
  d.items.forEach(it=>{
    const src1 = FOTOS_LOCALES ? LOCAL(it.t) : REMOTA(it.img);
    const src2 = FOTOS_LOCALES ? REMOTA(it.img) : LOCAL(it.t);
    const foto = it.img ? `<img class="foto" src="${src1}" data-alt="${src2}" alt="${it.pie||it.t}"
        loading="lazy" referrerpolicy="no-referrer"
        onerror="if(!this.dataset.retry){this.dataset.retry=1;this.src=this.dataset.alt;}else{this.style.display='none';this.nextElementSibling.style.display='flex';}">
      <div class="sinfoto">${it.t}</div>
      ${it.pie?`<div class="pie">${it.pie}</div>`:''}` : '';
    li+=`<li class="${it.comida?'comida':''}">
      <span class="hora">${it.h}</span>
      <div class="card">${foto}
        <div class="cuerpo">
          ${it.tipo?`<div class="tipo">${it.tipo}</div>`:''}
          <h3>${it.t}</h3>
          <p>${it.d}</p>
          ${it.sitio?`<div class="sitio">${it.sitio}</div>`:''}
          ${it.alerta?`<div class="alerta">${it.alerta}</div>`:''}
          ${it.historia?`<div class="historia">${it.historia}</div>`:''}
          ${it.suplente?`<div class="suplente">${it.suplente}</div>`:''}
        </div>
      </div></li>`;
  });
  html+=`<section class="panel" id="${d.id}">
    <h2 class="titulo">${d.titulo}</h2>
    <p class="bajada">${d.bajada}</p>
    <span class="marca ${d.marcaDuro?'duro':''}">${d.marca}</span>
    <ul class="tl">${li}</ul>
  </section>`;
});
return html;
}

function renderRes(GRUPOS,pref){
let res=`<section class="panel" id="${pref}-res">
  <h2 class="titulo">Reservas</h2>
  <p class="bajada">Marcada quiere decir confirmada por escrito, con nombre y número de reserva guardados.</p>
  <div class="barra"><span class="conteo" data-conteo="${pref}">0/0</span>
  <span class="progreso"><i data-pbar="${pref}"></i></span></div>`;
GRUPOS.forEach((g,gi)=>{
  res+=`<div class="grupo"><h3>${g.titulo}</h3><p class="nota">${g.nota}</p>`;
  g.items.forEach((it,ii)=>{
    res+=`<label class="item" data-r="${pref}" data-k="${pref}${gi}-${ii}">
      <input type="checkbox">
      <span><span class="que">${it.q}</span><br><span class="como">${it.c}</span></span></label>`;
  });
  res+='</div>';
});
return res+'</section>';
}

const mem={};
const guardar=(k,v)=>{ try{ localStorage.setItem('lx_'+k,v?'1':''); }catch(e){ mem[k]=v; } };
const leer=k=>{ try{ return localStorage.getItem('lx_'+k)==='1'; }catch(e){ return !!mem[k]; } };

document.querySelectorAll('.item').forEach(l=>{
  const k=l.dataset.k, cb=l.querySelector('input');
  cb.checked=leer(k); l.classList.toggle('listo',cb.checked);
  cb.addEventListener('change',()=>{ l.classList.toggle('listo',cb.checked); guardar(k,cb.checked); contar(l.dataset.r); });
});
function contar(r){
  if(!r) return REGIONES.forEach(x=>{ if(x.res) contar(x.id); });
  const items=document.querySelectorAll(`.item[data-r="${r}"] input`);
  const c=[...items].filter(i=>i.checked).length;
  const et=document.querySelector(`[data-conteo="${r}"]`), eb=document.querySelector(`[data-pbar="${r}"]`);
  if(et) et.textContent=c+'/'+items.length;
  if(eb) eb.style.width=(items.length?c/items.length*100:0)+'%';
}
contar();

document.querySelectorAll('[data-costos]').forEach(tc=>{
  tc.addEventListener('input',()=>{
    let s=0; tc.querySelectorAll('input').forEach(i=>s+=parseFloat(i.value)||0);
    document.querySelector(`[data-total="${tc.dataset.costos}"]`).textContent=s.toLocaleString('es-ES')+' €';
  });
});
